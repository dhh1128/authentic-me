---
layout: default
title: Convert Blake3-256 hash
---

<script type="module" src="util.js" defer></script>
<script type="module" src="cvt.js"></script>
<h1>{{ page.title }}</h1>

<label>Paste a hash</label>
<textarea id="val" rows="1" cols="80" maxlength="120"></textarea>
<div style="display:flex">
<button id="converter">Convert</button>
<div id="parsemsg" class="resettable" style="flex:1;text-align:right"></div>
</div>

<label class="copier" for="hex">hex</label>
<textarea readonly rows="1" cols="80" class="code resettable" id="hex" placeholder="e.g., 1413a76529897c2c4904597553fd60f44c1a9462cbb016e56c488e221d0badc7"></textarea>

<label class="copier" for="CESR">CESR</label>
<textarea readonly rows="1" cols="80" class="code resettable" id="CESR" placeholder="e.g., BGZ_DdmzryjQOtOdQauTm_YxggbVM7EWelk8IBxsnC-c"></textarea>

<script type="module">
import { el, reportParse } from './util.js';
import { Matter, MtrDex } from './cesr.js';

document.querySelector('#converter').addEventListener('click', cvtHash);
const val = el('val');
val.addEventListener('keydown', function(event) {
    if (event.key === 'Enter') {
        event.preventDefault();
        cvtHash();
    }
});
val.addEventListener('input', resetQR);

function cvtHash() {
    const val = el("val").value.trim();
    cesrPrimitive = describeCesr(val);
    if (cesrPrimitive != null) {
        const isError = !cesrPrimitive.includes('digest');
        reportParse("CESR " + cesrPrimitive, isError);
        if (isError) { return; }
    } else if (/[a-fA-F0-9]{64}/.exec(val)) {
        reportParse("Hex detected");
    } else {
        reportParse("not a hash", true);
        return;
    }
}
</script>
